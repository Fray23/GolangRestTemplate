version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 1
    restart: always
    command: "go run cmd/main.go"
    ports:
      - "20800"
    volumes:
      - ./src:/code/
    init: true

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "20801:80"
    depends_on:
      - backend

  database:
    image: postgres:16.4-alpine3.20
    ports:
      - "5441:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
