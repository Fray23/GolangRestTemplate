worker_processes auto;  # Автоматически устанавливает количество worker-процессов равное числу CPU


events {
    worker_connections 1024;  # Максимальное количество соединений на каждый worker-процесс
}

http {
    keepalive_requests 2000;  # Максимальное количество запросов на одно Keep-Alive соединение
    keepalive_timeout 30;  # Время ожидания для Keep-Alive соединений

    gzip on;
    gzip_comp_level 5;  # Уровень сжатия (1-9). Чем выше, тем больше сжатие, но больше нагрузка на CPU.
    gzip_min_length 256;  # Минимальный размер ответа для сжатия
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_vary on;

    upstream upstream_backend {
        server backend:20800;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
